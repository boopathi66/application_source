<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Online Bookstore</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f4f9; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ccc; padding-bottom: 10px; }
        .container { display: flex; gap: 20px; margin-top: 20px; }
        .main-content { flex: 3; }
        .sidebar { flex: 1; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .search-bar { width: 100%; padding: 10px; margin-bottom: 20px; font-size: 16px; box-sizing: border-box; }
        .book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .book-card { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        .category { font-size: 12px; color: #777; text-transform: uppercase; }
        .price { font-weight: bold; color: #2e7d32; margin: 10px 0; }
        .status { font-size: 12px; font-weight: bold; padding: 3px 8px; border-radius: 4px; display: inline-block; }
        .in-stock { background: #e8f5e9; color: #2e7d32; }
        .out-of-stock { background: #ffebee; color: #c62828; }
        button { background: #007bff; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .cart-item { display: flex; justify-content: space-between; margin-bottom: 10px; padding-bottom: 5px; border-bottom: 1px dashed #eee; }
    </style>
</head>
<body>

<header>
    <h1>📚 DevOps Tech Bookstore</h1>
    <div><strong>System Status:</strong> <span style="color: green; font-weight: bold;">Stable Release (v1.0.0)</span></div>
</header>

<div class="container">
    <div class="main-content">
        <input type="text" id="searchBar" class="search-bar" placeholder="Search by title or author..." oninput="filterBooks()">
        <div class="book-grid" id="bookGrid"></div>
    </div>
    
    <div class="sidebar">
        <h3>🛒 Shopping Cart</h3>
        <div id="cartItems">Empty</div>
        <p><strong>Total:</strong> \$<span id="cartTotal">0.00</span></p>
        <button id="checkoutBtn" style="width: 100%; background: #28a745;" onclick="placeOrder()" disabled>Place Order</button>
        
        <hr style="margin: 20px 0;">
        <h3>📦 Track Order Status</h3>
        <div id="orderStatusBox" style="display: none; padding: 10px; background: #e9ecef; border-radius: 4px;">
            <p><strong>Order ID:</strong> <span id="lblOrderId"></span></p>
            <p><strong>Status:</strong> <span id="lblOrderStatus" style="color: #007bff; font-weight: bold;"></span></p>
        </div>
    </div>
</div>

<script>
    const books = [
        { id: 1, title: "The Phoenix Project", author: "Gene Kim", category: "DevOps", price: 24.99, available: true },
        { id: 2, title: "Continuous Delivery", author: "Jez Humble", category: "CI/CD", price: 39.99, available: true },
        { id: 3, title: "Designing Data-Intensive Applications", author: "Martin Kleppmann", category: "Architecture", price: 45.50, available: true },
        { id: 4, title: "Kubernetes Up & Running", author: "Brendan Burns", category: "Cloud Native", price: 34.99, available: true },
        { id: 5, title: "Site Reliability Engineering", author: "Betsy Beyer", category: "SRE", price: 29.95, available: false },
        { id: 6, title: "Accelerate", author: "Nicole Forsgren", category: "DevOps", price: 22.00, available: true }
    ];

    let cart = [];

    function renderBooks(booksToRender) {
        const grid = document.getElementById('bookGrid');
        grid.innerHTML = '';
        booksToRender.forEach(book => {
            grid.innerHTML += `
                <div class="book-card">
                    <div class="category">${book.category}</div>
                    <h3>${book.title}</h3>
                    <p>By ${book.author}</p>
                    <div class="price">$${book.price.toFixed(2)}</div>
                    <span class="status ${book.available ? 'in-stock' : 'out-of-stock'}">${book.available ? 'In Stock' : 'Out of Stock'}</span>
                    <br>
                    <button ${!book.available ? 'disabled' : ''} onclick="addToCart(${book.id})">Add to Cart</button>
                </div>
            `;
        });
    }

    function filterBooks() {
        const query = document.getElementById('searchBar').value.toLowerCase();
        const filtered = books.filter(b => b.title.toLowerCase().includes(query) || b.author.toLowerCase().includes(query));
        renderBooks(filtered);
    }

    function addToCart(id) {
        const book = books.find(b => b.id === id);
        cart.push(book);
        updateCart();
    }

    function updateCart() {
        const container = document.getElementById('cartItems');
        const totalSpan = document.getElementById('cartTotal');
        const checkoutBtn = document.getElementById('checkoutBtn');
        
        if(cart.length === 0) {
            container.innerHTML = 'Empty';
            totalSpan.innerText = '0.00';
            checkoutBtn.disabled = true;
            return;
        }
        
        checkoutBtn.disabled = false;
        container.innerHTML = '';
        let total = 0;
        cart.forEach((item, idx) => {
            total += item.price;
            container.innerHTML += `
                <div class="cart-item">
                    <span>${item.title}</span>
                    <span>$${item.price.toFixed(2)}</span>
                </div>
            `;
        });
        totalSpan.innerText = total.toFixed(2);
    }

    function placeOrder() {
        const orderId = "ORD-" + Math.floor(100000 + Math.random() * 900000);
        cart = [];
        updateCart();
        
        document.getElementById('orderStatusBox').style.display = 'block';
        document.getElementById('lblOrderId').innerText = orderId;
        document.getElementById('lblOrderStatus').innerText = "Processing / Sent to Deployment Validation";
        
        setTimeout(() => {
            document.getElementById('lblOrderStatus').innerText = "Shipped via Kubernetes Pod!";
        }, 3000);
    }

    renderBooks(books);
</script>
</body>
</html>
